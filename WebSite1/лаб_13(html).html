<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор пиццы</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="pizza-selection">
            <div class="pizza" data-type="Пепперони">
                <img src="https://img.freepik.com/premium-photo/fresh-tasty-pizza-with-pepperoni-isolated-white_136401-2336.jpg?w=740" alt="Пепперони">
                <p>Пепперони</p>
            </div>
            <div class="pizza" data-type="Маргарита">
                <img src="https://img.freepik.com/free-psd/top-view-delicious-pizza_23-2151868922.jpg?t=st=1742555662~exp=1742559262~hmac=6d121cf72e342235f38e119641e099158860d5d9ae61e0c0ce89030d23fd105e&w=740" alt="Маргарита">
                <p>Маргарита</p>
            </div>
            <div class="pizza" data-type="Баварская">
                <img src="https://img.freepik.com/premium-photo/four-meat-pizza-composition-includes-four-types-meat-carbonade-chicken-cervelat-bacon-mozzarella-cheese-tomato-sauce-view-from-white-background-isolated_323569-203.jpg?w=740" alt="Баварская">
                <p>Баварская</p>
            </div>
        </div>
        <div class="options">
            <div class="label-with-icon">
  <h2>Выберите размер</h2>
  <img src="https://img.icons8.com/?size=100&id=EmFUTteEgnD8&format=png&color=000000" alt="Инфо" class="info-icon" title="Информация о размере пиццы">
</div>
            <div class="size-toggle">
                <button class="size active" data-size="Маленькая">Маленькая</button>
                <button class="size" data-size="Большая">Большая</button>
            </div>
            <h2 class="toppings-title">Добавить по вкусу</h2>
            <div class="toppings">
                <div class="topping" data-topping="Сырный борт">
                    <img src="https://t4.ftcdn.net/jpg/01/26/52/65/360_F_126526585_q8siNrwGf1lOmE9A15lFdxxeH3iwJJ50.jpg" alt="Сырный борт">
                    <h3>Сырный</h3>
                     <h3>борт</h3>
                  
                    <span>189₽</span>
                </div>
                <div class="topping" data-topping="Сливочная моцарелла">
                    <img src="https://img.freepik.com/premium-photo/mozzarella-cheese-basil-isolated-white-background_185193-30249.jpg?w=996" alt="Сливочная моцарелла">
                    <h3>Сливочная моцарелла</h3>
                  <span>99₽</span>
                </div>
                <div class="topping" data-topping="Чедер и пармезан">
                    <img src="https://img.freepik.com/premium-photo/piece-parmesan-cheese-white-table_220507-2696.jpg?w=996" alt="Чедер и пармезан">
                    <h3>Чедер и пармезан</h3>
                  <span>99₽</span>
                </div>
            </div>
            <button class="add-to-cart"><span>Добавить в корзину за</span>
              
    <span>559₽ (900 кКал)</span>
          </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
