<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Регистрация</title>
<link rel="stylesheet" href="src/styles/style.css" />
</head>
<body>
<header class="header">
  <nav class="nav">
    <a href="login.html">Войти</a>
    <a href="todos.html">Todos</a>
  </nav>
</header>

<main>
  <form id="reg-form" class="form">
    <label><input type="text" name="email" placeholder="Email" required /></label>
    <label><input type="text" name="name" placeholder="Имя" required /></label>
    <label><input type="number" name="age" placeholder="Возраст" required /></label>
    <label><input type="password" name="password" placeholder="Пароль" required /></label>
    <label><input type="password" name="passwordRepeat" placeholder="Повторите пароль" required /></label>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <div id="error-message" class="error-message" style="display:none;"></div>
</main>

<script type="module" src="src/pages/reg.js"></script>
</body>
</html>
